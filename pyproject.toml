[project]
name = "te-agent-migrate"
version = "0.1.0"
description = "Safely migrate ThousandEyes OVA Enterprise Agents between account groups."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1.7",
  "httpx>=0.27.2",
  "openpyxl>=3.1.5",
  "rich>=13.9.4",
]

[project.scripts]
te-agent-migrate = "te_agent_migrate.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.2",
  "types-openpyxl>=3.1.5.20241225",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/te_agent_migrate"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["te_agent_migrate"]
